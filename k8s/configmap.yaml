# ConfigMap para a API
# Armazena configurações NÃO sensíveis
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-api-config
  namespace: fiap-cloud-games
  labels:
    app.kubernetes.io/name: catalog-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: fiap-cloud-games
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  TZ: "America/Sao_Paulo"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
  Logging__LogLevel__Microsoft.EntityFrameworkCore: "Warning"

  # RabbitMQ - Configurações não sensíveis
  RabbitMq__Host: "rabbitmq"
  RabbitMq__Port: "5672"
  RabbitMq__Username: "admin"
  Jwt__Issuer: "FiapCloudGames"
  Jwt__Audience: "FiapCloudGames"

  # Redis / Mongo - Configurações não sensíveis
  ConnectionStrings__Redis: "redis:6379"
  MongoDb__Database: "FiapCloudGamesCatalog"
  Cache__JogosTtlSeconds: "300"

  # Elasticsearch gerenciado. A API key fica no Key Vault, não aqui.
  Elasticsearch__Url: "https://my-elasticsearch-project-a1b56c.es.brazilsouth.azure.elastic.cloud:443"
  Elasticsearch__Index: "jogos"
