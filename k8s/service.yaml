# Service para a API
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: fiap-cloud-games
  labels:
    app.kubernetes.io/name: catalog-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: fiap-cloud-games
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: catalog-api
